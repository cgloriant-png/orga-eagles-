name: Build & Release Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup environment and keystore
        run: |
          touch .env
          cp .env.example .env 2>/dev/null || true
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Planning_Paramoteur.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Planning Paramoteur v1.0.${{ github.run_number }}"
          body: "Application prête à être installée sur votre smartphone Android. Téléchargez le fichier **Planning_Paramoteur.apk** ci-dessous."
          files: release-output/Planning_Paramoteur.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


