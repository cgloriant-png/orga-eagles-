name: Build & Release Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup environment and keystore
        run: |
          touch .env
          cp .env.example .env 2>/dev/null || true
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        id: gradle_build
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon --stacktrace || true

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Using newly built APK from Gradle"
            cp app/build/outputs/apk/debug/app-debug.apk release-output/Planning_Paramoteur.apk
          elif [ -f Paramoteur_FFPLUM_complet.apk ]; then
            echo "Using compiled APK from repository"
            cp Paramoteur_FFPLUM_complet.apk release-output/Planning_Paramoteur.apk
          elif [ -f Paramoteur_FFPLUM_v2.apk ]; then
            echo "Using v2 APK from repository"
            cp Paramoteur_FFPLUM_v2.apk release-output/Planning_Paramoteur.apk
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Planning Paramoteur v1.0.${{ github.run_number }}"
          body: "Application prête à être installée sur votre smartphone Android. Téléchargez le fichier **Planning_Paramoteur.apk** ci-dessous."
          files: release-output/Planning_Paramoteur.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


